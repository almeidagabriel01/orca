name: Fork upstream sync

# Hourly: when stablyai/orca publishes a newer stable release, merge upstream main into fork-main,
# check it, bump to <upstream version>-fork.1 and run the fork release, so installed fork builds offer
# the update. On a conflict or a failing check nothing is pushed or released: one issue labelled
# upstream-sync says why, updated only when something changes; a conflict leaves the run green. Installed fork builds also dispatch this when they see the new release.
# See docs/fork-releases.md.

on:
  # Fires hourly (GitHub may delay it); installed apps also dispatch the sync (docs/fork-releases.md).
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: fork-upstream-sync
  cancel-in-progress: false

env:
  FORK_BRANCH: fork-main
  UPSTREAM_REPO: stablyai/orca
  ISSUE_LABEL: upstream-sync

jobs:
  sync:
    if: github.repository != 'stablyai/orca'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      # The merge adds an `upstream` remote, which gh would otherwise pick as the repo to act on.
      GH_REPO: ${{ github.repository }}
      ORCA_BACKGROUND_LAUNCH: '1'
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      # Something outside these workflows has disabled the release more than once; a sync must still publish.
      - name: Keep the fork release enabled
        run: |
          set -euo pipefail
          state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/fork-release.yml" --jq .state)"
          if [[ "$state" != active ]]; then
            gh workflow enable fork-release.yml --repo "$GITHUB_REPOSITORY"
            echo "::warning::fork-release.yml was $state; re-enabled it."
            echo "Re-enabled \`fork-release.yml\`, which was \`$state\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Why before checkout: most hours have no new release, and a full-history checkout takes minutes.
      - name: Find a newer upstream release
        id: upstream
        run: |
          set -euo pipefail
          tag="$(gh release view --repo "$UPSTREAM_REPO" --json tagName --jq .tagName)"
          upstream="${tag#v}"
          current="$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$FORK_BRANCH" --jq .content | base64 -d | jq -r .version)"
          base="${current%%-fork.*}"
          newer="$(node -e 'const [a, b] = process.argv.slice(1).map((v) => v.split(".").map(Number)); console.log(a[0] - b[0] || a[1] - b[1] || a[2] - b[2])' "$upstream" "$base")"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          if [[ ! "$upstream" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || (( newer <= 0 )); then
            echo "Fork $current already covers upstream $tag."
            echo "newer=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "newer=true" >> "$GITHUB_OUTPUT"
          echo "Upstream $tag is newer than fork base $base."

      - uses: actions/checkout@v6
        if: steps.upstream.outputs.newer == 'true'
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0
          # GITHUB_TOKEN may not push commits that touch .github/workflows, and upstream changes them
          # often; FORK_SYNC_TOKEN (contents + workflows write) can.
          token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}

      - name: Fetch upstream main
        id: fetch
        if: steps.upstream.outputs.newer == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git"
          git fetch --no-tags upstream main
          echo "commit=$(git rev-parse upstream/main)" >> "$GITHUB_OUTPUT"

      # The fork's own work may wait on release/fork-next before it reaches fork-main; a sync that
      # released without it would replace installed builds with ones missing those features.
      - name: Require fork work to be in fork-main
        id: forkwork
        if: steps.fetch.outcome == 'success'
        run: |
          set -euo pipefail
          if git fetch --no-tags origin release/fork-next 2>/dev/null &&
            ! git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "::error::release/fork-next has commits fork-main lacks. Merge it into fork-main, then run the sync again."
            exit 1
          fi

      - name: Merge upstream main
        id: merge
        if: steps.forkwork.outcome == 'success'
        env:
          UPSTREAM: ${{ steps.upstream.outputs.upstream }}
        run: |
          set -euo pipefail
          if ! git merge --no-ff --no-edit -m "merge: upstream v$UPSTREAM" upstream/main; then
            # Upstream bumping package.json's version line always collides with ours; keep ours.
            if git diff --name-only --diff-filter=U | grep -qx package.json; then
              node config/scripts/fork/fork-version.mjs --resolve-conflict && git add package.json || true
            fi
            # Generated per-file ratchet baselines collide whenever both sides touch neighbouring rows;
            # take upstream's here and regenerate from the merged code once dependencies are installed.
            regen=""
            for f in config/react-compiler-bailout-baseline.txt config/react-compiler-hazard-baseline.txt; do
              if git diff --name-only --diff-filter=U | grep -qx "$f"; then
                git checkout --theirs -- "$f" && git add "$f" && regen=true
              fi
            done
            echo "regen-compiler-baseline=$regen" >> "$GITHUB_OUTPUT"
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [[ -n "$conflicts" ]]; then
              # A conflict needs a person, not an hourly red run: report it once in the sync issue and stop.
              { echo 'conflicts<<EOF'; echo "$conflicts"; echo EOF; } >> "$GITHUB_OUTPUT"
              echo "conflicted=true" >> "$GITHUB_OUTPUT"
              git merge --abort
              echo "::warning::Merging upstream v$UPSTREAM conflicts in: $conflicts"
              exit 0
            fi
            git commit --no-edit
          fi
          node config/scripts/fork/fork-version.mjs --base "$UPSTREAM"
          git commit -am "chore(release): $(node -p 'require("./package.json").version')"

      - name: Setup pnpm
        if: steps.merge.outcome == 'success' && steps.merge.outputs.conflicted != 'true'
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        if: steps.merge.outcome == 'success' && steps.merge.outputs.conflicted != 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        id: install
        if: steps.merge.outcome == 'success' && steps.merge.outputs.conflicted != 'true'
        run: |
          npm install -g node-gyp@11.5.0
          export npm_config_node_gyp="$(npm root -g)/node-gyp/bin/node-gyp.js"
          pnpm install --frozen-lockfile

      - name: Regenerate the React Compiler baselines
        if: steps.install.outcome == 'success' && steps.merge.outputs.regen-compiler-baseline == 'true'
        run: |
          pnpm check:react-compiler-compat-ratchet --update
          git add config/react-compiler-*-baseline.txt
          git diff --cached --quiet || git commit -m "chore: regenerate React Compiler baselines after upstream merge"

      # Typecheck catches what a clean textual merge breaks; the fork's own tests guard its features.
      - name: Typecheck
        id: typecheck
        if: steps.install.outcome == 'success'
        run: pnpm run tc

      - name: Fork feature tests
        id: tests
        if: steps.typecheck.outcome == 'success'
        run: |
          mapfile -t tests < <(git diff --name-only --diff-filter=AM upstream/main HEAD | grep -E '\.test\.(ts|tsx|mjs)$' || true)
          if (( ${#tests[@]} )); then pnpm test "${tests[@]}" --maxWorkers=2; fi

      - name: Push
        id: push
        if: steps.tests.outcome == 'success'
        run: git push origin "HEAD:$FORK_BRANCH"

      # Upstream workflows arrive enabled with every merge; only the fork's own may run here. Every
      # run sweeps, so one registered a moment after the push is caught the next hour.
      - name: Disable upstream workflows
        if: always()
        run: |
          set -euo pipefail
          gh workflow list --all --limit 1000 --json path,state --jq '.[] | select(.state == "active") | .path' |
            { grep -vE '/fork-(release|sync)\.yml$' || true; } |
            while read -r path; do
              echo "Disabling $path"
              gh workflow disable "$(basename "$path")"
            done

      - name: Release
        id: release
        if: steps.push.outcome == 'success'
        run: gh workflow run fork-release.yml --ref "$FORK_BRANCH" -f publish=true

      # Installed builds read an open issue as a failed build of that version; close it once fork-main has it.
      - name: Close the sync issue
        if: steps.push.outcome == 'success' || steps.upstream.outputs.newer == 'false'
        continue-on-error: true
        env:
          UPSTREAM: ${{ steps.upstream.outputs.upstream }}
        run: |
          set -euo pipefail
          title="Sync com o Orca original falhou: v$UPSTREAM"
          gh issue list --label "$ISSUE_LABEL" --state open --search "\"$title\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" |
            while read -r number; do
              gh issue close "$number" --comment "Resolvido: \`$FORK_BRANCH\` mesclou upstream v$UPSTREAM e o release foi disparado."
            done

      - name: Open an issue
        if: (failure() || steps.merge.outputs.conflicted == 'true') && steps.upstream.outputs.newer == 'true'
        env:
          UPSTREAM: ${{ steps.upstream.outputs.upstream }}
          COMMIT: ${{ steps.fetch.outputs.commit }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          FORKWORK: ${{ steps.forkwork.outcome }}
          MERGE: ${{ steps.merge.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          PUSH: ${{ steps.push.outcome }}
          RELEASE: ${{ steps.release.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -n "$CONFLICTS" ]]; then
            reason="Conflito ao mesclar upstream/main."
            details="$(printf -- '- `%s`\n' $CONFLICTS)"
          else
            failed=""
            for step in "release/fork-next in fork-main:$FORKWORK" "merge:$MERGE" "install:$INSTALL" "typecheck (pnpm tc):$TYPECHECK" "fork feature tests:$TESTS" "push to $FORK_BRANCH:$PUSH" "release dispatch:$RELEASE"; do
              [[ "${step##*:}" == failure ]] && failed="${step%:*}"
            done
            reason="Verificação falhou: ${failed:-veja a run}."
            details="Veja o log da etapa na run."
          fi
          sent="nada foi enviado nem lançado"
          [[ "$PUSH" == success ]] && sent="merge enviado, release não disparado"
          title="Sync com o Orca original falhou: v$UPSTREAM"
          body="$(cat <<EOF
          Upstream: [$UPSTREAM_REPO v$UPSTREAM](https://github.com/$UPSTREAM_REPO/releases/tag/v$UPSTREAM)
          Commit do upstream/main mesclado: [\`$COMMIT\`](https://github.com/$UPSTREAM_REPO/commit/$COMMIT)
          Branch: \`$FORK_BRANCH\` ($sent)
          Run: $RUN_URL

          **$reason**

          $details
          EOF
          )"
          # One issue per upstream version; it changes only when the upstream commit or the reason does.
          key="sync-key: $COMMIT $(printf '%s' "$reason $details" | sha256sum | cut -c1-16)"
          body="$body"$'\n\n'"<!-- $key -->"
          gh label create "$ISSUE_LABEL" --color FBCA04 --description "Fork upstream sync failures" --force
          existing="$(gh issue list --label "$ISSUE_LABEL" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            gh issue create --title "$title" --label "$ISSUE_LABEL" --body "$body"
          elif gh issue view "$existing" --json body --jq .body | grep -qF "$key"; then
            echo "Issue #$existing already reports this; nothing new to say."
          else
            gh issue edit "$existing" --body "$body"
            gh issue comment "$existing" --body "Atualizado: $reason Run: $RUN_URL"
          fi
